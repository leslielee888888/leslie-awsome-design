name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build before lint: ui-react's type-aware ESLint rules (projectService)
      # need core/tokens' dist/*.d.ts to resolve their imports' real types.
      # On a truly fresh checkout (no gitignored dist/ left over from a prior
      # local run) those don't exist until a build has happened, so lint ran
      # first would treat every core/tokens import as an unresolved "error"
      # type and fail with a wall of @typescript-eslint/no-unsafe-* findings.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
